  gemini:
    display_name: Google Gemini
    aliases: [gemini, bard, deepmind, google-ai]
    known_domains:
      - gemini.google.com
      - gemini.google
      - gemini.gstatic.com
      - generativelanguage.googleapis.com
      - ai.google.dev
      - ai.studio
      - aistudio.google.com
      - deepmind.com
      - deepmind.google
      - notebooklm.google.com
      - notebooklm.google
      - jules.google.com
      - jules.google
      - labs.google.com
      - labs.google
