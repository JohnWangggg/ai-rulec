services:
  openai:
    display_name: OpenAI
    aliases: [openai, chatgpt, codex, sora]
    known_domains:
      - openai.com
      - openai.org
      - chatgpt.com
      - chatgpt.site
      - chat.com
      - ai.com
      - oaistatic.com
      - oaiusercontent.com
      - oaistatsig.com
      - sora.com
      - openai.com.cdn.cloudflare.net
      - openaiapi-site.azureedge.net
      - openaicom.imgix.net
    known_processes: [ChatGPT, ChatGPT.exe, chatgpt, Codex, Codex.exe, codex, codex.exe]

  anthropic:
    display_name: Anthropic / Claude
    aliases: [anthropic, claude, mcp]
    known_domains:
      - anthropic.com
