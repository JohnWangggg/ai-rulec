[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rulec"
dynamic = ["version"]
description = "Compile AI service rules into verifiable mihomo, sing-box and Surge artifacts"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Internet :: Proxy Servers",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
keywords = ["ai", "proxy", "mihomo", "clash", "sing-box", "surge", "rule-set"]

[project.scripts]
ai-rulec = "ai_rulec.cli:main"

[project.urls]
Homepage = "https://github.com/JohnWangggg/ai-rulec"
Documentation = "https://github.com/JohnWangggg/ai-rulec/tree/main/docs"
Issues = "https://github.com/JohnWangggg/ai-rulec/issues"
Changelog = "https://github.com/JohnWangggg/ai-rulec/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["ai_rulec"]

[tool.setuptools.package-data]
ai_rulec = ["data/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "ai_rulec.__version__" }
